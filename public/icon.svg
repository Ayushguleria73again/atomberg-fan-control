<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#0ea5e9" stroke-opacity="0.3" stroke-width="4" />
  
  <!-- Fan Blades Group -->
  <g transform="translate(256,256)" filter="url(#glow)">
    <!-- Central Hub Outer Ring -->
    <circle r="44" fill="#0f172a" stroke="url(#cyanGrad)" stroke-width="8" />
    
    <!-- 3 Blades -->
    <!-- Blade 1 -->
    <path d="M 0,-24 C -30,-80 -50,-160 -10,-185 C 30,-210 70,-160 30,-70 C 15,-35 8,-20 0,-24 Z" fill="url(#cyanGrad)" opacity="0.95" />
    
    <!-- Blade 2 (Rotated 120 deg) -->
    <path d="M 0,-24 C -30,-80 -50,-160 -10,-185 C 30,-210 70,-160 30,-70 C 15,-35 8,-20 0,-24 Z" fill="url(#cyanGrad)" opacity="0.95" transform="rotate(120)" />
    
    <!-- Blade 3 (Rotated 240 deg) -->
    <path d="M 0,-24 C -30,-80 -50,-160 -10,-185 C 30,-210 70,-160 30,-70 C 15,-35 8,-20 0,-24 Z" fill="url(#cyanGrad)" opacity="0.95" transform="rotate(240)" />
    
    <!-- Central Hub Inner Cap -->
    <circle r="22" fill="#38bdf8" />
    <circle r="10" fill="#0b1329" />
  </g>
</svg>
